name: MapMe
options:
  bundleIdPrefix: com.mapme
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: B8P24AZNQT
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    # Single source of truth for the app bundle ID. All five targets derive
    # their bundle IDs from this variable. The watch app's Info.plist also
    # references it via $(IOS_APP_BUNDLE_ID) for WKCompanionAppBundleIdentifier.
    IOS_APP_BUNDLE_ID: com.mybrightzone.app

targets:
  MapMe-iOS:
    type: application
    platform: iOS
    sources:
      - path: MapMe
        excludes:
          - "Resources/Info-macOS.plist"
          - "Resources/Info-tvOS.plist"
          - "Resources/MapMe-macOS.entitlements"
          - "Resources/MapMe-tvOS.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_APP_BUNDLE_ID)
        PRODUCT_NAME: MapMe
        INFOPLIST_FILE: MapMe/Resources/Info-iOS.plist
        CODE_SIGN_ENTITLEMENTS: MapMe/Resources/MapMe-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: '"MapMe/Preview Content"'

  MapMe-macOS:
    type: application
    platform: macOS
    sources:
      - path: MapMe
        excludes:
          - "Resources/Info-iOS.plist"
          - "Resources/Info-tvOS.plist"
          - "Resources/MapMe-iOS.entitlements"
          - "Resources/MapMe-tvOS.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_APP_BUNDLE_ID)
        PRODUCT_NAME: MapMe
        INFOPLIST_FILE: MapMe/Resources/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: MapMe/Resources/MapMe-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_ASSET_PATHS: '"MapMe/Preview Content"'

  MapMe-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: MapMe
        excludes:
          - "Resources/Info-iOS.plist"
          - "Resources/Info-macOS.plist"
          - "Resources/MapMe-iOS.entitlements"
          - "Resources/MapMe-macOS.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_APP_BUNDLE_ID)
        PRODUCT_NAME: MapMe
        INFOPLIST_FILE: MapMe/Resources/Info-tvOS.plist
        CODE_SIGN_ENTITLEMENTS: MapMe/Resources/MapMe-tvOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: '"MapMe/Preview Content"'

  MapMe-Watch:
    type: application
    platform: watchOS
    sources:
      - path: MapMeWatch
      - path: MapMe/Models
      - path: MapMe/Persistence
      - path: MapMe/Services/SharingService.swift
      - path: MapMe/Services/AuthService.swift
      - path: MapMe/Services/SnapToRoadsService.swift
      - path: MapMe/Services/MotionActivityMonitor.swift
    dependencies:
      - target: MapMeWatchWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_APP_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: MapMe
        INFOPLIST_FILE: MapMeWatch/Resources/Info-watchOS.plist
        CODE_SIGN_ENTITLEMENTS: MapMeWatch/Resources/MapMe-watchOS.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: '"MapMeWatch/Preview Content"'

  MapMeWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: MapMeWatchWidgets
      - path: MapMeWatch/Services/WatchSharedState.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_APP_BUNDLE_ID).watchkitapp.widgets
        PRODUCT_NAME: MapMeWatchWidgets
        INFOPLIST_FILE: MapMeWatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: MapMeWatchWidgets/MapMeWatchWidgets.entitlements
        SKIP_INSTALL: YES

schemes:
  # All schemes disable Metal API Validation. MapKit's internal render
  # pass on iOS/tvOS/macOS occasionally trips the validator with
  # "MTLStoreActionMultisampleResolve store action at attachment 0
  # requires resolve texture" — a benign transient state during view
  # transitions (e.g. flipping the tvOS dashboard between Controls
  # mode and Map mode). The app recovers fine without the validator
  # crashing the run; the only way to suppress the assertion is to
  # turn validation off at the scheme level.
  #
  # xcodegen regenerates the project each run, so a manual Xcode-side
  # toggle gets reset. Encoding it here is the only way to make the
  # setting survive across `xcodegen generate`.
  MapMe-iOS:
    build:
      targets:
        MapMe-iOS: all
    run:
      config: Debug
      # `enableGPUValidationMode: disabled` turns off Metal API
      # Validation; `enableGPUFrameCaptureMode: disabled` skips GPU
      # frame capture instrumentation. Both belong directly on `run:`
      # in xcodegen (the previous `diagnostics:` block was silently
      # ignored — xcodegen's diagnostics scope only covers
      # sanitizers + mainThreadChecker, not Metal validation).
      enableGPUValidationMode: disabled
      enableGPUFrameCaptureMode: disabled
  MapMe-macOS:
    build:
      targets:
        MapMe-macOS: all
    run:
      config: Debug
      # `enableGPUValidationMode: disabled` turns off Metal API
      # Validation; `enableGPUFrameCaptureMode: disabled` skips GPU
      # frame capture instrumentation. Both belong directly on `run:`
      # in xcodegen (the previous `diagnostics:` block was silently
      # ignored — xcodegen's diagnostics scope only covers
      # sanitizers + mainThreadChecker, not Metal validation).
      enableGPUValidationMode: disabled
      enableGPUFrameCaptureMode: disabled
  MapMe-tvOS:
    build:
      targets:
        MapMe-tvOS: all
    run:
      config: Debug
      # `enableGPUValidationMode: disabled` turns off Metal API
      # Validation; `enableGPUFrameCaptureMode: disabled` skips GPU
      # frame capture instrumentation. Both belong directly on `run:`
      # in xcodegen (the previous `diagnostics:` block was silently
      # ignored — xcodegen's diagnostics scope only covers
      # sanitizers + mainThreadChecker, not Metal validation).
      enableGPUValidationMode: disabled
      enableGPUFrameCaptureMode: disabled
  MapMe-Watch:
    build:
      targets:
        MapMe-Watch: all
    run:
      config: Debug
      # `enableGPUValidationMode: disabled` turns off Metal API
      # Validation; `enableGPUFrameCaptureMode: disabled` skips GPU
      # frame capture instrumentation. Both belong directly on `run:`
      # in xcodegen (the previous `diagnostics:` block was silently
      # ignored — xcodegen's diagnostics scope only covers
      # sanitizers + mainThreadChecker, not Metal validation).
      enableGPUValidationMode: disabled
      enableGPUFrameCaptureMode: disabled
